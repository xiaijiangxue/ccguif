name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build_macos_arm64:
    name: macos (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: |
          set -euo pipefail
          # Create CI config that disables updater signing
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > /tmp/tauri-ci-config.json
          npm run tauri -- build --target aarch64-apple-darwin --bundles app --config /tmp/tauri-ci-config.json

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          VERSION=$(python3 -c "import json; print(json.loads(open('src-tauri/tauri.conf.json').read())['version'])")
          bash scripts/create-dmg.sh \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ccgui.app \
            release-artifacts/ccgui_${VERSION}_aarch64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-artifacts/*.dmg
          retention-days: 30

  build_windows_x64:
    name: windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          '{"bundle": {"createUpdaterArtifacts": false}}' | Out-File -FilePath "$env:TEMP\tauri-ci-config.json" -Encoding ascii
          npm run tauri -- build --config src-tauri/tauri.windows.conf.json --config "$env:TEMP\tauri-ci-config.json" --bundles nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
